<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Log In - Minimum Coin Change System</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h1>Log In</h1>
        <p class="subtitle">Enter your credentials to access your account</p>

        <form id="login-form" class="form">
          <div class="form-group">
            <label for="li-username">Username</label>
            <input id="li-username" type="text" placeholder="Enter your username" required />
          </div>
          <div class="form-group">
            <label for="li-password">Password</label>
            <input id="li-password" type="password" placeholder="Enter your password" required />
          </div>
          <button class="btn btn-primary btn-lg" type="submit" style="width: 100%;">Log in</button>
        </form>

        <div id="li-msg" class="auth-message" style="display:none;"></div>

        <div class="demo-hint">
          <p><strong>Demo Account:</strong></p>
          <p>Username: <code>saptarshi</code></p>
          <p>Password: <code>2005</code></p>
        </div>

        <div class="auth-link">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const u = document.getElementById('li-username').value.trim();
        const p = document.getElementById('li-password').value;
        const res = loginUser(u, p);
        const msg = document.getElementById('li-msg');
        msg.style.display = 'block';
        if (res.success) {
          msg.classList.remove('error');
          msg.classList.add('success');
          msg.textContent = '✅ Login successful! Redirecting...';
          setTimeout(() => (location.href = 'home.html'), 1500);
        } else {
          msg.classList.remove('success');
          msg.classList.add('error');
          msg.textContent = '❌ ' + res.message;
        }
      });
    </script>
  </body>
</html>
