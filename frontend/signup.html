<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sign Up - Minimum Coin Change System</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to save your calculations and preferences</p>

        <form id="signup-form" class="form">
          <div class="form-group">
            <label for="su-username">Username</label>
            <input id="su-username" type="text" placeholder="Choose a username" required />
          </div>
          <div class="form-group">
            <label for="su-password">Password</label>
            <input id="su-password" type="password" placeholder="Enter a password" required />
          </div>
          <button class="btn btn-primary btn-lg" type="submit" style="width: 100%;">Sign up</button>
        </form>

        <div id="su-msg" class="auth-message" style="display:none;"></div>

        <div class="auth-link">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.getElementById('signup-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const u = document.getElementById('su-username').value.trim();
        const p = document.getElementById('su-password').value;
        const msg = document.getElementById('su-msg');
        
        msg.style.display = 'block';
        msg.className = 'auth-message';
        msg.textContent = 'Creating account...';

        const res = await createUser(u, p);
        
        if (res.success) {
          msg.classList.remove('error');
          msg.classList.add('success');
          msg.textContent = '✅ Account created! Redirecting to login...';
          setTimeout(() => (location.href = 'login.html'), 1500);
        } else {
          msg.classList.remove('success');
          msg.classList.add('error');
          msg.textContent = '❌ ' + (res.message || 'Unknown error occurred.');
        }
      });
    </script>
  </body>
</html>
