<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Sign Up - CoinChange Professional</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card glass-panel">
        <h1 style="font-family: 'Outfit'; font-weight: 800; margin-bottom: 8px;">Create Identity</h1>
        <p class="subtitle" style="margin-bottom: 32px;">Join the elite algorithm workspace</p>

        <form id="signup-form" class="form">
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="su-username">Choose Identity</label>
            <input id="su-username" type="text" placeholder="Username" required />
          </div>
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="su-password">Set Access Key</label>
            <input id="su-password" type="password" placeholder="Password" required />
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%; border-radius: 12px; height: 50px; margin-top: 16px;">Initialize Account</button>
        </form>

        <div id="su-msg" class="auth-message" style="display:none; margin-top: 16px; padding: 12px; border-radius: 8px;"></div>

        <div class="auth-link" style="text-align: center; margin-top: 24px;">
          Already registered? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Authorize Existing</a>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      document.getElementById('signup-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const u = document.getElementById('su-username').value.trim();
        const p = document.getElementById('su-password').value;
        const msg = document.getElementById('su-msg');
        
        msg.style.display = 'block';
        msg.className = 'auth-message';
        msg.textContent = 'Initializing identity...';

        const res = await createUser(u, p);
        
        if (res.success) {
          msg.style.background = 'rgba(16, 185, 129, 0.2)';
          msg.style.color = 'var(--success)';
          msg.textContent = '✅ Identity created. Redirecting to authorization...';
          setTimeout(() => (location.href = '/login'), 1200);
        } else {
          msg.style.background = 'rgba(239, 68, 68, 0.2)';
          msg.style.color = 'var(--danger)';
          msg.textContent = '❌ Initialization Failed: ' + (res.message || 'Unknown error');
        }
      });
    </script>
  </body>
</html>
