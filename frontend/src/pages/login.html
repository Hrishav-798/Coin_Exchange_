<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Log In - CoinChange Professional</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card glass-panel">
        <h1 style="font-family: 'Outfit'; font-weight: 800; margin-bottom: 8px;">Log In</h1>
        <p class="subtitle" style="margin-bottom: 32px;">Secure access to the algorithm matrix</p>

        <form id="login-form" class="form">
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="li-username">Identity</label>
            <input id="li-username" type="text" placeholder="Username" required />
          </div>
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="li-password">Access Key</label>
            <input id="li-password" type="password" placeholder="Password" required />
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%; border-radius: 12px; height: 50px; margin-top: 16px;">Authorize</button>
        </form>

        <div id="li-msg" class="auth-message" style="display:none; margin-top: 16px; padding: 12px; border-radius: 8px;"></div>



        <div class="auth-link" style="text-align: center; margin-top: 16px;">
          New to the system? <a href="/signup" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Identity</a>
        </div>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const u = document.getElementById('li-username').value.trim();
        const p = document.getElementById('li-password').value;
        const msg = document.getElementById('li-msg');
        
        msg.style.display = 'block';
        msg.className = 'auth-message';
        msg.textContent = 'Verifying identity...';

        const res = await loginUser(u, p);
        
        if (res.success) {
          msg.style.background = 'rgba(16, 185, 129, 0.2)';
          msg.style.color = 'var(--success)';
          msg.textContent = '✅ Authorization granted. Entering dashboard...';
          setTimeout(() => (location.href = '/home'), 1200);
        } else {
          msg.style.background = 'rgba(239, 68, 68, 0.2)';
          msg.style.color = 'var(--danger)';
          msg.textContent = '❌ Access Denied: ' + res.message;
        }
      });
    </script>
  </body>
</html>
